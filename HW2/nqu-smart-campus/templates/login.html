<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NQU Smart Campus Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <section class="login-card">
    <div class="login-logo">NQU</div>
    <p class="eyebrow">National Quemoy University</p>
    <h1>Smart Campus</h1>
    <p class="muted">Student Information System & AI Assistant</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Student ID</label>
      <input name="student_id" placeholder="111210501" required>
      <label>Password</label>
      <input name="password" type="password" placeholder="••••••••" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="demo">
      Demo account<br><strong>111210501</strong> / <strong>nqu1234</strong>
    </div>
  </section>
</body>
</html>
